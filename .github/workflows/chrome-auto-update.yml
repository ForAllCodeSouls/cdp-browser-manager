name: Chrome for Testing Auto Update

# 让浏览器内核跟随 Chrome for Testing 官网稳定版自动升级。
# 每天检查一次：官网版本 > 两个 Dockerfile 里的 CHROME_VERSION 时，
# 更新版本号并提交，从而触发 docker-build.yml 重新构建 full/headless 镜像。
on:
  schedule:
    - cron: "17 3 * * *"   # 每天 UTC 03:17（北京时间 11:17）
  workflow_dispatch:       # 允许在 Actions 页面手动触发

concurrency:
  group: chrome-for-testing-update
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 读取官网稳定版版本号
        id: upstream
        run: |
          set -euo pipefail
          URL="https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          VERSION=$(python3 - "$URL" <<'PY'
          import json, sys, urllib.request
          with urllib.request.urlopen(sys.argv[1], timeout=30) as r:
              data = json.load(r)
          stable = data["channels"]["Stable"]
          version = stable["version"]
          # 确认 linux64 的 chrome 与 chrome-headless-shell 都有下载，避免更新到不可用版本。
          dl = stable.get("downloads", {})
          for key in ("chrome", "chrome-headless-shell"):
              if not any(x.get("platform") == "linux64" for x in dl.get(key, [])):
                  raise SystemExit(f"官网稳定版缺少 linux64 的 {key} 下载，跳过更新")
          print(version)
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "官网稳定版: $VERSION"

      - name: 对比并更新 Dockerfile
        id: apply
        env:
          NEW_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          FILES="Dockerfile.browser Dockerfile.browser-headless"
          changed=0
          for f in $FILES; do
            cur=$(grep -oP '^ARG CHROME_VERSION=\K[^ ]+' "$f" | head -1 || true)
            echo "$f 当前版本: $cur"
            if [ "$cur" != "$NEW_VERSION" ]; then
              sed -i "s/^ARG CHROME_VERSION=.*/ARG CHROME_VERSION=$NEW_VERSION/" "$f"
              changed=1
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: 提交版本更新
        if: steps.apply.outputs.changed == '1'
        env:
          NEW_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile.browser Dockerfile.browser-headless
          git commit -m "chore: bump Chrome for Testing to $NEW_VERSION" || {
            echo "没有可提交的改动，跳过"
            exit 0
          }
          git push
          echo "已提交 Chrome 版本更新，将触发 docker-build.yml 构建新镜像"
