<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CDP Browser Manager</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-2: #222634;
            --border: #2e3345;
            --text: #e6e8f0;
            --muted: #8b90a5;
            --accent: #5b8cff;
            --accent-hover: #4778ef;
            --success: #3ecf8e;
            --danger: #ff6b6b;
            --radius: 10px;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        header {
            flex: 0 0 auto;
            padding: 14px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 { font-size: 17px; margin: 0; font-weight: 600; }
        .subtitle { color: var(--muted); font-size: 12px; margin-top: 2px; }
        .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        button {
            font: inherit;
            font-size: 13px;
            padding: 7px 13px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            cursor: pointer;
            transition: background .15s, opacity .15s;
        }
        button:hover:not(:disabled) { background: #2c3143; }
        button:disabled { opacity: .45; cursor: not-allowed; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-danger { color: var(--danger); border-color: #5a3038; }
        .btn-danger:hover:not(:disabled) { background: #3a2026; }

        .layout { flex: 1; display: flex; min-height: 0; }
        aside {
            width: 272px;
            flex: 0 0 272px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            overflow-y: auto;
        }
        .side-head {
            padding: 12px 14px;
            font-size: 12px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 1;
        }
        .side-stat { color: var(--text); font-weight: 600; }
        .item {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background .12s;
        }
        .item:hover { background: var(--surface-2); }
        .item.active { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
        .item .sid {
            font-family: ui-monospace, monospace;
            font-size: 12px;
            font-weight: 600;
            word-break: break-all;
        }
        .item .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 7px;
            font-size: 11px;
            color: var(--muted);
        }
        .side-empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 12px; }

        .viewer {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px 18px 18px;
        }
        .detail {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 12px;
        }
        .detail .sid { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 600; }
        .detail .kv { color: var(--muted); }
        .detail .kv b { color: var(--text); font-family: ui-monospace, monospace; font-weight: 500; }
        .detail .spacer { flex: 1; }

        .frame-wrap {
            flex: 1;
            min-height: 280px;
            position: relative;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #000;
            overflow: hidden;
        }
        .frame-host { position: absolute; inset: 0; }
        .frame-host iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
        .frame-overlay {
            position: absolute; inset: 0; z-index: 2;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; text-align: center; padding: 20px;
            background: #0f1117f2; color: var(--muted); font-size: 13px;
        }
        .frame-overlay.show { display: flex; }
        .frame-overlay.error { color: var(--danger); }
        .frame-overlay .spin {
            width: 28px; height: 28px;
            border: 3px solid var(--border); border-top-color: var(--accent);
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .frame-overlay .hint { font-size: 11px; color: var(--muted); max-width: 420px; line-height: 1.6; }

        .empty-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
        }
        .empty-view h2 { color: var(--text); font-size: 15px; font-weight: 600; margin: 0 0 6px; }

        .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
        .badge.running { background: #173d30; color: var(--success); }
        .badge.stopped { background: #3a2026; color: var(--danger); }
        .badge.pending { background: #2c3143; color: var(--muted); }
        .copy { font-size: 11px; padding: 2px 8px; margin-left: 6px; }

        .toast {
            position: fixed; bottom: 22px; right: 22px;
            background: var(--surface-2); border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            padding: 11px 16px; border-radius: 8px; font-size: 13px;
            opacity: 0; transform: translateY(10px);
            transition: opacity .2s, transform .2s;
            pointer-events: none; z-index: 99; max-width: 380px;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { border-left-color: var(--danger); }
        .toast.ok { border-left-color: var(--success); }
        a.link { color: var(--accent); text-decoration: none; }
        a.link:hover { text-decoration: underline; }

        .settings-mask {
            position: fixed; inset: 0; background: #0009;
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .settings-mask.open { display: flex; }
        .settings-panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 22px 24px; width: 420px; max-width: 92vw;
        }
        .settings-panel h3 { margin: 0 0 16px; font-size: 16px; }
        .settings-row { margin-bottom: 16px; }
        .settings-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .settings-row select {
            width: 100%; padding: 8px 10px; font: inherit; font-size: 13px;
            background: var(--surface-2); color: var(--text);
            border: 1px solid var(--border); border-radius: 8px;
        }
        .settings-hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
        .settings-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
        .settings-foot { font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }

        @media (max-width: 760px) {
            .layout { flex-direction: column; }
            aside { width: 100%; flex: 0 0 auto; max-height: 190px; border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>CDP Browser Manager</h1>
            <div class="subtitle">左侧切换实例 · 画面自动连接 · CDP 调试</div>
        </div>
        <div class="toolbar">
            <button onclick="openSettings()">⚙ 设置</button>
            <button onclick="load()">刷新</button>
            <button class="btn-danger" onclick="stopAll()" id="btnStopAll">停止全部</button>
            <button class="btn-primary" onclick="create()" id="btnCreate">+ 新建实例</button>
        </div>
    </header>

    <div class="layout">
        <aside>
            <div class="side-head"><span>实例列表（点击切换画面）</span><span class="side-stat" id="sideStat">0</span></div>
            <div id="instanceList"></div>
        </aside>
        <section class="viewer">
            <div class="detail" id="detail"></div>
            <div class="empty-view" id="viewerEmpty">
                <h2>暂无可显示的画面</h2>
                <div>点击左侧实例，或点右上角「新建实例」</div>
            </div>
            <div class="frame-wrap" id="frameWrap" style="display:none">
                <div class="frame-overlay" id="frameOverlay"></div>
                <div class="frame-host" id="frameHost"></div>
            </div>
        </section>
    </div>

    <div class="toast" id="toast"></div>

    <div class="settings-mask" id="settingsMask" onclick="if(event.target===this) closeSettings()">
        <div class="settings-panel">
            <h3>设置</h3>
            <div class="settings-row">
                <label for="setPage">noVNC 页面</label>
                <select id="setPage">
                    <option value="vnc_lite.html">精简版 vnc_lite.html（推荐，打开即连）</option>
                    <option value="vnc.html">完整版 vnc.html（带工具栏/设置）</option>
                </select>
                <div class="settings-hint">精简版：无连接按钮，加载即自动连接。<br>完整版：功能全（全屏、剪贴板、Ctrl+Alt+Del），默认也自动连接。</div>
            </div>
            <div class="settings-row">
                <label for="setScale">画面缩放</label>
                <select id="setScale">
                    <option value="1">自适应缩放（推荐）</option>
                    <option value="0">原始尺寸</option>
                </select>
            </div>
            <div class="settings-foot">设置保存在本机浏览器，仅影响当前设备；下次打开自动生效。</div>
            <div class="settings-actions">
                <button onclick="closeSettings()">取消</button>
                <button class="btn-primary" onclick="saveSettings()">保存并重新连接</button>
            </div>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        let instances = {};
        let selectedSid = null;
        let frameSid = null;        // 当前 iframe 加载的实例 sid
        let frameTimer = null;
        let busy = false;

        // 设置：默认精简版 vnc_lite.html，持久化到 localStorage
        const SETTINGS_KEY = "cdpManagerSettings";
        function loadSettings() {
            try {
                const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
                return {
                    page: s.page === "vnc.html" ? "vnc.html" : "vnc_lite.html",
                    scale: s.scale === "0" ? "0" : "1",
                };
            } catch (e) {
                return { page: "vnc_lite.html", scale: "1" };
            }
        }
        let settings = loadSettings();

        function openSettings() {
            $("setPage").value = settings.page;
            $("setScale").value = settings.scale;
            $("settingsMask").classList.add("open");
        }
        function closeSettings() { $("settingsMask").classList.remove("open"); }
        function saveSettings() {
            settings = { page: $("setPage").value, scale: $("setScale").value };
            try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
            closeSettings();
            frameSid = null;   // 强制重建 iframe 以应用新设置
            render();
            toast("设置已保存，画面重新连接", "ok");
        }

        function toast(msg, type = "") {
            const t = $("toast");
            t.textContent = msg;
            t.className = "toast show " + type;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.className = "toast", 3200);
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        // 根据设置生成 noVNC 地址。两版参数不同：
        // vnc_lite.html：加载即连，缩放参数 scale=1
        // vnc.html：需 autoconnect=1，缩放参数 resize=scale
        function vncUrl(i) {
            const base = (i.novnc_url || ("http://" + location.hostname + ":" + i.novnc_port))
                .split("?")[0]
                .replace(/\/vnc(_lite|_auto)?\.html\/?$/, "");
            const isLite = settings.page === "vnc_lite.html";
            const page = settings.page;
            const params = isLite
                ? (settings.scale === "1" ? "scale=1" : "")
                : ("autoconnect=1" + (settings.scale === "1" ? "&resize=scale" : "") + "&reconnect=1");
            return base + "/" + page + (params ? "?" + params : "");
        }

        function statusBadge(i) {
            if (i.status === "running") {
                if (i.cdp_ready === true) return '<span class="badge running">CDP 已就绪</span>';
                if (i.cdp_ready === false) return '<span class="badge stopped">CDP 未响应</span>';
                return '<span class="badge pending">检测中</span>';
            }
            if (i.status === "exited" || i.status === "dead") return '<span class="badge stopped">已停止</span>';
            return '<span class="badge pending">' + esc(i.status || "未知") + '</span>';
        }

        function setBusy(v) {
            busy = v;
            $("btnCreate").disabled = v;
            $("btnStopAll").disabled = v;
        }

        async function api(url, options = {}, timeoutMs = 15000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const res = await fetch(url, { ...options, signal: ctrl.signal });
                if (!res.ok) {
                    let detail = res.statusText;
                    try { detail = (await res.json()).detail || detail; } catch (e) {}
                    throw new Error(detail);
                }
                return await res.json();
            } catch (e) {
                if (e.name === "AbortError") throw new Error("请求超时（服务器可能正忙），请稍后重试");
                throw e;
            } finally {
                clearTimeout(timer);
            }
        }

        async function load(quiet = false) {
            try {
                const data = await api("/api/list");
                instances = data.instances || {};
                render();
            } catch (e) {
                if (!quiet) toast("加载失败: " + e.message, "error");
            }
        }

        // ---- 画面加载：切换时彻底销毁旧 iframe 再新建，避免卡死实例残留旧画面 ----
        function clearFrame() {
            if (frameTimer) { clearTimeout(frameTimer); frameTimer = null; }
            const host = $("frameHost");
            while (host.firstChild) host.removeChild(host.firstChild);
            $("frameOverlay").className = "frame-overlay";
            $("frameOverlay").innerHTML = "";
            frameSid = null;
        }

        function frameLoading(sid) {
            const o = $("frameOverlay");
            o.className = "frame-overlay show";
            o.innerHTML = '<div class="spin"></div>' +
                '<div>正在连接实例 ' + esc(sid.slice(0, 8)) + ' 的画面…</div>' +
                '<div class="hint">首次连接约需 2-5 秒</div>';
        }

        function frameFailed(sid, msg) {
            const o = $("frameOverlay");
            o.className = "frame-overlay show error";
            o.innerHTML = '<div>画面无法连接：' + esc(sid.slice(0, 8)) + '</div>' +
                '<div class="hint">' + esc(msg || "该实例画面服务无响应，可能尚未就绪或已卡死") + '</div>' +
                '<button onclick="retryFrame()">重试</button>';
        }

        function mountFrame(sel) {
            clearFrame();
            frameSid = sel.sid;
            frameLoading(sel.sid);
            $("frameWrap").style.display = "block";

            const f = document.createElement("iframe");
            f.id = "mainFrame";
            f.title = "浏览器画面";
            f.allow = "clipboard-read; clipboard-write";
            const url = vncUrl(sel);
            f.onload = () => {
                if (frameSid !== sel.sid) return;
                if (frameTimer) { clearTimeout(frameTimer); frameTimer = null; }
                $("frameOverlay").className = "frame-overlay";
                $("frameOverlay").innerHTML = "";
            };
            f.onerror = () => { if (frameSid === sel.sid) frameFailed(sel.sid); };
            f.src = url;
            $("frameHost").appendChild(f);

            // 12 秒仍未触发 load 则判定失败，给出明确反馈而非静默保留旧画面
            frameTimer = setTimeout(() => {
                if (frameSid === sel.sid && $("frameOverlay").classList.contains("show")) {
                    frameFailed(sel.sid, "连接超时，实例画面服务无响应");
                }
            }, 12000);
        }

        function retryFrame() {
            const sel = selectedSid ? instances[selectedSid] : null;
            if (sel) mountFrame(sel);
        }

        function render() {
            const list = Object.values(instances);
            $("sideStat").textContent = list.length;

            if (!list.some(i => i.sid === selectedSid)) {
                const first = list.find(i => i.status === "running") || list[0];
                selectedSid = first ? first.sid : null;
            }

            if (!list.length) {
                $("instanceList").innerHTML = '<div class="side-empty">暂无实例<br>点右上角新建</div>';
            } else {
                $("instanceList").innerHTML = list.map(i =>
                    '<div class="item' + (i.sid === selectedSid ? ' active' : '') + '" onclick="selectSid(\'' + i.sid + '\')">' +
                        '<div class="sid">' + esc(i.sid.slice(0, 8)) + '</div>' +
                        '<div class="meta">' + statusBadge(i) +
                            '<span>CDP ' + esc(i.debug_port || "-") + '</span>' +
                            '<span>:' + esc(i.novnc_port || "-") + '</span>' +
                        '</div>' +
                    '</div>'
                ).join("");
            }

            const sel = selectedSid ? instances[selectedSid] : null;
            if (!sel) {
                $("detail").innerHTML = "";
            } else {
                const cdp = sel.cdp_addr || ("127.0.0.1:" + sel.debug_port);
                const url = vncUrl(sel);
                $("detail").innerHTML =
                    '<span class="sid">' + esc(sel.sid.slice(0, 8)) + '</span>' + statusBadge(sel) +
                    '<span class="kv">CDP <b id="cdpVal">' + esc(cdp) + '</b>' +
                        '<button class="copy" onclick="copyCdp()">复制</button></span>' +
                    '<span class="spacer"></span>' +
                    '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener">新窗口打开</a>' +
                    '<button class="btn-danger" onclick="stop(\'' + sel.sid + '\')">停止</button>';
            }

            // 关键：只有选中实例变化时才重建 iframe；轮询不打断 VNC 连接。
            // 重建而非改 src，避免目标卡死时浏览器保留上一个实例的旧画面。
            if (!sel || sel.status !== "running") {
                clearFrame();
                $("frameWrap").style.display = "none";
                $("viewerEmpty").style.display = "flex";
            } else {
                $("viewerEmpty").style.display = "none";
                if (frameSid !== sel.sid) mountFrame(sel);
            }
        }

        function selectSid(sid) {
            if (selectedSid === sid) return;
            selectedSid = sid;
            render();
        }

        async function copyCdp() {
            const el = $("cdpVal");
            if (!el) return;
            const text = el.textContent;
            try {
                await navigator.clipboard.writeText(text);
                toast("已复制 CDP 地址: " + text, "ok");
            } catch (e) {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
                toast("已复制 CDP 地址", "ok");
            }
        }

        async function create() {
            if (busy) return;
            setBusy(true);
            const btn = $("btnCreate");
            const original = btn.textContent;
            btn.textContent = "创建中…";
            toast("正在创建实例，首次启动可能需要十几秒…");
            try {
                const data = await api("/instance/new", { method: "POST" }, 45000);
                selectedSid = data.sid;
                frameSid = null;
                toast("实例已创建，画面将自动连接", "ok");
                await load();
            } catch (e) {
                toast("创建失败: " + e.message, "error");
            } finally {
                btn.textContent = original;
                setBusy(false);
            }
        }

        async function stop(sid) {
            if (busy) return;
            setBusy(true);
            try {
                await api("/instance/" + encodeURIComponent(sid) + "/stop", { method: "POST" });
                if (selectedSid === sid) { selectedSid = null; frameSid = null; }
                toast("实例已停止", "ok");
                await load();
            } catch (e) {
                toast("停止失败: " + e.message, "error");
            } finally {
                setBusy(false);
            }
        }

        async function stopAll() {
            if (busy) return;
            if (!confirm("确定停止全部浏览器实例？")) return;
            setBusy(true);
            try {
                await api("/instance/stop-all", { method: "POST" });
                selectedSid = null;
                frameSid = null;
                toast("已停止全部实例", "ok");
                await load();
            } catch (e) {
                toast("操作失败: " + e.message, "error");
            } finally {
                setBusy(false);
            }
        }

        load();
        setInterval(() => load(true), 10000);
    </script>
</body>
</html>
