<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抓屏画面</title>
<style>
    :root {
        --bg: #0f1117; --surface: #171a23; --surface-2: #1f2330;
        --border: #2a3042; --text: #e6e8ef; --muted: #9aa3b5;
        --accent: #5b8cff; --danger: #ff6b6b; --success: #4ade80; --warn: #e0b341;
        --scroll-thumb: #3a4055; --scroll-thumb-hover: #4c5470; --scroll-track: transparent;
    }
    * { box-sizing: border-box; }
    * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) var(--scroll-track); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb); border-radius: 999px;
        border: 2px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: padding-box; }
    ::-webkit-scrollbar-corner { background: transparent; }
    body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
    }
    header h1 { font-size: 14px; margin: 0; font-weight: 500; }
    header .sid { font-family: ui-monospace, monospace; color: var(--muted); font-size: 12px; }
    header .state { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
    header .state.live { color: var(--success); }
    header .state.err { color: var(--danger); }
    header .spacer { margin-left: auto; }
    button {
        font: inherit; cursor: pointer; padding: 4px 10px; font-size: 12px;
        background: var(--surface-2); color: var(--text);
        border: 1px solid var(--border); border-radius: 7px;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    button.icon { width: 30px; padding: 4px 0; text-align: center; }
    .castbar {
        display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .castbar .tabrow { display: flex; align-items: center; gap: 5px; flex: 1 1 100%; min-width: 0; overflow-x: auto; padding-bottom: 2px; }
    .castbar .navrow { display: flex; align-items: center; gap: 6px; flex: 1 1 100%; min-width: 0; }
    .chip {
        flex: 0 1 150px; min-width: 30px; display: inline-flex; align-items: center;
        border: 1px solid var(--border); background: var(--surface-2); border-radius: 6px;
        padding: 3px 6px; font-size: 11px; cursor: pointer; white-space: nowrap; overflow: hidden;
    }
    .chip.on { border-color: var(--accent); color: var(--accent); }
    .chip .label { overflow: hidden; text-overflow: ellipsis; }
    .chip .x { margin-left: 6px; color: var(--muted); font-weight: 600; }
    .chip .x:hover { color: var(--danger); }
    .castbar input.url {
        flex: 1; min-width: 120px; background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font-size: 12px;
    }
    .stage {
        flex: 1; position: relative; min-height: 0; display: flex; align-items: center; justify-content: center;
        background: #0c0e14; overflow: hidden;
    }
    .stage canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; cursor: default; outline: none; }
    .overlay {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: var(--muted); font-size: 12px; text-align: center; padding: 16px; pointer-events: none;
    }
    .overlay.hide { display: none; }
    .overlay button { pointer-events: auto; }
    .hint { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
    <header>
        <h1>抓屏画面</h1>
        <span class="sid" id="sidLabel">—</span>
        <span class="state" id="state">连接中…</span>
        <span class="spacer"></span>
        <span class="hint" id="qualityHint"></span>
    </header>
    <div class="castbar" id="castBar">
        <div class="tabrow" id="tabRow"></div>
        <div class="navrow" id="navRow"></div>
    </div>
    <div class="stage" id="stage">
        <canvas id="screen" tabindex="0"></canvas>
        <div class="overlay" id="overlay">正在连接…</div>
    </div>

<script>
    // 独立抓屏页：只连当前面板的 /ws/cast 通道，从 /api/list 与 /api/instance/<sid>/targets
    // 读取实例与标签信息。密钥与画质设置沿用同源 localStorage（和管理页一致），
    // 也支持 URL 上的 key 参数（远端面板跳转时透传，避免跨域名密钥丢失）。
    const QS = new URLSearchParams(location.search);
    const SID = QS.get("sid") || "";
    const TID_HINT = QS.get("tid") || "";
    const KEY_STORAGE = "cdpManagerApiKey";
    const SETTINGS_KEY = "cdpManagerSettings";
    let apiKey = QS.get("key") || "";
    try { if (!apiKey) apiKey = localStorage.getItem(KEY_STORAGE) || ""; } catch (e) {}
    if (QS.get("key")) { try { localStorage.setItem(KEY_STORAGE, apiKey); } catch (e) {} }

    let settings = {};
    try { settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") || {}; } catch (e) {}
    const quality = ["low", "medium", "high"].includes(settings.quality) ? settings.quality : "medium";
    const captureMode = settings.captureMode === "snap" ? "snap" : "cast";
    const snapRate = ["fast", "normal", "eco"].includes(settings.snapRate) ? settings.snapRate : "normal";

    const $ = (id) => document.getElementById(id);
    const canvas = $("screen");
    const overlay = $("overlay");
    const stateEl = $("state");
    let inst = null;
    let targets = [];
    let tid = TID_HINT;
    let ws = null;
    let wsRef = { ws: null };
    const viewport = { w: 0, h: 0 };
    let gen = 0;
    let pollTimer = null;
    let history = null;
    let preferredTid = TID_HINT;

    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function authHeaders() { return apiKey ? { "X-API-Key": apiKey } : {}; }
    function keyQuery(url) {
        if (!apiKey) return url;
        return url + (url.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(apiKey);
    }
    // 远端实例：实例级 API 必须走本机 /remote/<host> 前缀，由 manager 代理到那台主机。
    function scopeUrl(url) {
        const m = String(url).match(/^\/(?:api\/)?instance\/([^/?]+)/);
        if (!m || !inst) return url;
        const host = inst.host;
        return host && host !== "local"
            ? "/remote/" + encodeURIComponent(host) + url : url;
    }
    async function api(url, options = {}, timeoutMs = 15000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
            const res = await fetch(keyQuery(scopeUrl(url)), {
                ...options,
                headers: { ...(options.headers || {}), ...authHeaders() },
                signal: ctrl.signal,
            });
            if (!res.ok) {
                let detail = "";
                try { detail = (await res.json()).detail || ""; } catch (e) {}
                throw new Error(detail || ("HTTP " + res.status));
            }
            return await res.json();
        } finally { clearTimeout(timer); }
    }

    function setState(text, cls) {
        stateEl.textContent = text;
        stateEl.className = "state" + (cls ? " " + cls : "");
    }
    function showOverlay(html) {
        overlay.innerHTML = html;
        overlay.className = "overlay";
    }
    function hideOverlay() { overlay.className = "overlay hide"; }

    function wsUrl() {
        let tpl = inst.cast_ws || ("/ws/cast/" + inst.sid + "/{tid}");
        tpl = keyQuery(tpl.replace("{tid}", encodeURIComponent(tid)));
        tpl += (tpl.includes("?") ? "&" : "?") + "quality=" + encodeURIComponent(quality);
        tpl += "&mode=" + captureMode + "&snap=" + encodeURIComponent(snapRate);
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        return proto + "//" + location.host + tpl;
    }

    // 两路帧（screencast 缩放帧 / 定时截图原始帧）尺寸不同且解码异步，
    // 旧帧可能后到覆盖新帧。按序号只画最新帧；canvas 尺寸只在宽高比真正
    // 变化时重设，平时把任意尺寸帧缩放画进固定画布，避免重设清空导致的黑闪。
    let frameSeq = 0, drawnSeq = 0;
    function drawFrame(data) {
        const seq = ++frameSeq;
        const img = new Image();
        img.onload = () => {
            if (seq <= drawnSeq) return;
            drawnSeq = seq;
            const cw = canvas.width, ch = canvas.height;
            const ratio = img.width / (img.height || 1);
            if (!cw || !ch || Math.abs(ratio - cw / ch) > 0.02) {
                canvas.width = img.width; canvas.height = img.height;
            }
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = "data:image/jpeg;base64," + data;
    }

    function connect() {
        if (ws) { try { ws.close(); } catch (e) {} ws = null; }
        const myGen = ++gen;
        let received = false;
        setState("连接中…");
        const socket = new WebSocket(wsUrl());
        ws = socket;
        wsRef.ws = socket;
        socket.onopen = () => { if (myGen === gen) setState("实时", "live"); };
        socket.onmessage = (ev) => {
            let msg;
            try { msg = JSON.parse(ev.data); } catch (e) { return; }
            if (myGen !== gen) return;
            if (msg.type === "error") {
                setState("出错", "err");
                showOverlay(esc(msg.message || "抓屏代理出错"));
                return;
            }
            if (msg.type === "url" && typeof msg.url === "string") {
                const t = targets.find(x => x.id === tid);
                if (t) t.url = msg.url;
                const box = $("castUrl");
                if (box && document.activeElement !== box) box.value = msg.url;
                return;
            }
            if (msg.type === "frame" && msg.data) {
                if (msg.vw > 0 && msg.vh > 0) { viewport.w = msg.vw; viewport.h = msg.vh; }
                drawFrame(msg.data);
                received = true;
                hideOverlay();
                setState("实时", "live");
            }
        };
        socket.onerror = () => {};
        socket.onclose = () => {
            if (ws === socket) ws = null;
            if (myGen !== gen) return;
            setState("已断开", "err");
            if (!received) showOverlay('抓屏连接失败。<br><button onclick="connect()">重试</button>');
        };
    }

    function castSend(method, params) {
        if (wsRef.ws && wsRef.ws.readyState === WebSocket.OPEN) {
            wsRef.ws.send(JSON.stringify({ type: "input", method: method, params: params }));
        }
    }

    // 坐标：画面用 object-fit:contain 居中，留白不属于画面；画质档会缩小图片。
    // 屏幕坐标 -> 图片像素 -> 浏览器真实视口坐标。
    function point(e, clamp) {
        const r = canvas.getBoundingClientRect();
        const iw = canvas.width || 1, ih = canvas.height || 1;
        if (!r.width || !r.height) return null;
        const scale = Math.min(r.width / iw, r.height / ih);
        const drawW = iw * scale, drawH = ih * scale;
        const offX = (r.width - drawW) / 2, offY = (r.height - drawH) / 2;
        let ix = (e.clientX - r.left - offX) / scale;
        let iy = (e.clientY - r.top - offY) / scale;
        if (!clamp && (ix < 0 || iy < 0 || ix > iw || iy > ih)) return null;
        ix = Math.max(0, Math.min(iw, ix));
        iy = Math.max(0, Math.min(ih, iy));
        const vw = viewport.w > 0 ? viewport.w : iw;
        const vh = viewport.h > 0 ? viewport.h : ih;
        return {
            x: Math.max(0, Math.min(vw, Math.round(ix * vw / iw))),
            y: Math.max(0, Math.min(vh, Math.round(iy * vh / ih))),
        };
    }
    const buttonName = (n) => n === 2 ? "right" : n === 1 ? "middle"
        : n === 3 ? "back" : n === 4 ? "forward" : "left";
    const buttonBits = (n) => n === 2 ? 2 : n === 1 ? 4
        : n === 3 ? 8 : n === 4 ? 16 : 1;
    const mods = (e) => (e.ctrlKey ? 2 : 0) | (e.altKey ? 1 : 0) |
        (e.shiftKey ? 8 : 0) | (e.metaKey ? 4 : 0);

    let pressed = false;
    let pendingMove = null;
    canvas.addEventListener("mousemove", (e) => {
        pendingMove = e;
        if (pendingMove.__raf) return;
        pendingMove.__raf = requestAnimationFrame(() => {
            const ev = pendingMove; pendingMove = null;
            if (!ev) return;
            const p = point(ev, ev.buttons > 0);
            if (!p) return;
            castSend("Input.dispatchMouseEvent", {
                type: "mouseMoved", x: p.x, y: p.y, buttons: ev.buttons, modifiers: mods(ev),
            });
        });
    });
    canvas.addEventListener("mousedown", (e) => {
        const p = point(e);
        if (!p) return;
        canvas.focus();
        pressed = true;
        castSend("Input.dispatchMouseEvent", {
            type: "mousePressed", x: p.x, y: p.y,
            button: buttonName(e.button), clickCount: e.detail || 1,
            buttons: e.buttons || buttonBits(e.button), modifiers: mods(e),
        });
    });
    canvas.addEventListener("mouseup", (e) => {
        pressed = false;
        e.__castHandled = true;
        const p = point(e);
        if (!p) return;
        castSend("Input.dispatchMouseEvent", {
            type: "mouseReleased", x: p.x, y: p.y,
            button: buttonName(e.button), clickCount: e.detail || 1,
            buttons: e.buttons, modifiers: mods(e),
        });
    });
    document.addEventListener("mouseup", (e) => {
        if (e.__castHandled || !pressed) return;
        pressed = false;
        const p = point(e, true);
        if (!p) return;
        castSend("Input.dispatchMouseEvent", {
            type: "mouseReleased", x: p.x, y: p.y,
            button: buttonName(e.button), clickCount: 1,
            buttons: e.buttons, modifiers: mods(e),
        });
    });
    canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const p = point(e, true);
        if (!p) return;
        const unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? (viewport.h > 0 ? viewport.h : 720) : 1;
        let dx = e.deltaX * unit, dy = e.deltaY * unit;
        const MIN_STEP = 20;
        if (dx !== 0 && Math.abs(dx) < MIN_STEP) dx = Math.sign(dx) * MIN_STEP;
        if (dy !== 0 && Math.abs(dy) < MIN_STEP) dy = Math.sign(dy) * MIN_STEP;
        castSend("Input.dispatchMouseEvent", {
            type: "mouseWheel", x: p.x, y: p.y,
            deltaX: dx, deltaY: dy, buttons: e.buttons,
            modifiers: mods(e), pointerType: "mouse",
        });
    }, { passive: false });
    canvas.addEventListener("auxclick", (e) => e.preventDefault());
    canvas.addEventListener("keydown", (e) => {
        const printable = !!e.key && e.key.length === 1;
        castSend("Input.dispatchKeyEvent", {
            type: "keyDown", key: e.key, code: e.code,
            windowsVirtualKeyCode: e.keyCode, nativeVirtualKeyCode: e.keyCode,
            modifiers: mods(e),
            text: printable ? e.key : undefined,
            unmodifiedText: printable ? e.key : undefined,
        });
        if (printable || ["Enter", "Backspace", "Tab", "ArrowLeft",
            "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) e.preventDefault();
    });
    canvas.addEventListener("keyup", (e) => {
        castSend("Input.dispatchKeyEvent", {
            type: "keyUp", key: e.key, code: e.code,
            windowsVirtualKeyCode: e.keyCode, nativeVirtualKeyCode: e.keyCode,
            modifiers: mods(e),
        });
    });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    // ---- 简易导航条：标签切换/关闭、地址栏、前进后退、刷新 ----
    function normalizeUrl(raw) {
        const s = (raw || "").trim();
        if (!s) return "";
        if (/^[A-Za-z][A-Za-z0-9+.-]*:/.test(s)) return s;
        if (s.startsWith("//")) return "https:" + s;
        if (/^localhost(:\d+)?(\/|\?|$)/i.test(s)) return "http://" + s;
        return "https://" + s;
    }
    async function cmd(method, params) {
        return api("/api/instance/" + encodeURIComponent(SID) + "/cmd", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ target_id: tid, method: method, params: params || {} }),
        });
    }
    async function updateHistory() {
        try {
            const r = await cmd("Page.getNavigationHistory", {});
            const d = r && r.result;
            if (d && Array.isArray(d.entries)) {
                history = { index: Number(d.currentIndex) || 0, ids: d.entries.map(e => e.id) };
            }
        } catch (e) { history = null; }
        renderBar();
    }
    function historyStep(delta) {
        if (!history) { updateHistory(); return; }
        const idx = history.index + delta;
        const entryId = history.ids[idx];
        if (idx < 0 || idx >= history.ids.length || entryId === undefined) return;
        cmd("Page.navigateToHistoryEntry", { entryId: entryId })
            .then(() => updateHistory()).catch(() => {});
    }
    function renderBar() {
        const chips = targets.map(t =>
            '<span class="chip ' + (t.id === tid ? "on" : "") + '" title="' + esc(t.url) +
            '" onclick="switchTarget(' + JSON.stringify(t.id).replace(/"/g, "&quot;") + ')">' +
            '<span class="label">' + esc(t.title || t.url || "无标题") + '</span>' +
            '<span class="x" title="关闭此标签" onclick="event.stopPropagation(); closeTarget(' +
            JSON.stringify(t.id).replace(/"/g, "&quot;") + ')">×</span></span>'
        ).join("");
        const cur = targets.find(t => t.id === tid) || {};
        const canBack = !!history && history.index > 0;
        const canForward = !!history && history.index < history.ids.length - 1;
        $("tabRow").innerHTML = chips +
            '<button onclick="newTarget()">+ 新标签</button>';
        $("navRow").innerHTML =
            '<button class="icon" title="后退" onclick="historyStep(-1)"' + (canBack ? "" : " disabled") + '>‹</button>' +
            '<button class="icon" title="前进" onclick="historyStep(1)"' + (canForward ? "" : " disabled") + '>›</button>' +
            '<button class="icon" title="刷新" onclick="reloadPage()">⟳</button>' +
            '<input class="url" id="castUrl" value="' + esc(cur.url || "") + '" placeholder="输入网址后按回车跳转">';
        const input = $("castUrl");
        input.onkeydown = (e) => {
            if (e.key !== "Enter" || e.isComposing) return;
            e.preventDefault();
            navigate((e.target && e.target.value) || "");
        };
        input.onclick = () => { try { input.select(); } catch (e) {} };
    }

    function switchTarget(id) {
        preferredTid = id;
        if (id === tid) return;
        tid = id;
        history = null;
        connect();
        renderBar();
        updateHistory();
    }
    function navigate(raw) {
        const url = normalizeUrl(raw);
        if (!url) return;
        cmd("Page.navigate", { url: url }).then(() => {
            setTimeout(updateHistory, 800);
        }).catch((e) => setState("导航失败: " + e.message, "err"));
    }
    function reloadPage() {
        cmd("Page.reload", { ignoreCache: false }).then(() => {
            setTimeout(updateHistory, 700);
        }).catch(() => {});
    }
    async function newTarget() {
        const raw = prompt("新标签页打开的地址：", "about:blank");
        if (raw === null) return;
        const url = normalizeUrl(raw) || "about:blank";
        try {
            const created = await api("/api/instance/" + encodeURIComponent(SID) + "/targets", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: url }),
            });
            if (created && created.id) preferredTid = created.id;
            await refreshTargets();
        } catch (e) { setState("新建标签失败: " + e.message, "err"); }
    }
    function closeTarget(id) {
        api("/api/instance/" + encodeURIComponent(SID) + "/targets/" + encodeURIComponent(id), {
            method: "DELETE",
        }).then(() => refreshTargets()).catch(() => {});
    }
    async function refreshTargets() {
        try {
            const data = await api("/api/instance/" + encodeURIComponent(SID) + "/targets");
            const list = data.targets || [];
            if (!list.length) return;
            targets = list;
            if (!targets.some(t => t.id === tid)) {
                tid = targets.some(t => t.id === preferredTid) ? preferredTid : targets[0].id;
                connect();
                updateHistory();
            }
            renderBar();
        } catch (e) {}
    }

    async function load() {
        if (!SID) {
            setState("参数错误", "err");
            showOverlay("缺少 sid 参数，请从管理页的按钮进入。");
            return;
        }
        $("sidLabel").textContent = SID.slice(0, 8);
        $("qualityHint").textContent = { low: "省流", medium: "均衡", high: "高清" }[quality] + " · " +
            (captureMode === "snap" ? "Snap" : "Cast");
        try {
            const data = await api("/api/list", {}, 10000);
            const list = data.instances || {};
            inst = list[SID] || Object.values(list).find(x => x.sid === SID);
            if (!inst) throw new Error("找不到该实例（可能已停止或删除）");
        } catch (e) {
            setState("加载失败", "err");
            showOverlay(esc("无法加载实例：" + e.message));
            return;
        }
        try {
            const data = await api("/api/instance/" + encodeURIComponent(SID) + "/targets");
            targets = data.targets || [];
        } catch (e) {
            setState("标签加载失败", "err");
            showOverlay(esc("无法读取标签页：" + e.message));
            return;
        }
        if (!targets.length) {
            try {
                const created = await api("/api/instance/" + encodeURIComponent(SID) + "/targets", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: "about:blank" }),
                });
                if (created && created.id) {
                    targets = [{ id: created.id, title: "", url: "about:blank", type: "page" }];
                    tid = created.id;
                }
            } catch (e) {}
        }
        if (!targets.length) {
            setState("无标签", "err");
            showOverlay("该浏览器没有可抓屏的标签页。");
            return;
        }
        if (!tid || !targets.some(t => t.id === tid)) {
            tid = targets.some(t => t.id === preferredTid) ? preferredTid : targets[0].id;
        }
        renderBar();
        updateHistory();
        connect();
        pollTimer = setInterval(refreshTargets, 2500);
    }
    load();
    window.addEventListener("beforeunload", () => {
        if (pollTimer) clearInterval(pollTimer);
        if (ws) { try { ws.close(); } catch (e) {} }
    });
</script>
</body>
</html>
