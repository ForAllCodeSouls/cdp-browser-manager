name: Build & Push CDP Browser Manager

on:
  push:
    branches: [ main ]
  # 允许在 Actions 页面手动重建单个镜像/全部镜像，不必为了重打而改代码。
  workflow_dispatch:

# 旧构建跑完再跑新的，避免两个 run 同时覆盖 :latest 造成版本错乱。
concurrency:
  group: cdp-browser-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push manager
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.manager
          push: true
          tags: ghcr.io/forallcodesouls/cdp-browser-manager:latest
          # scope 分开，三份镜像的缓存互不污染。
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager

      - name: Build & Push browser (full)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.browser
          push: true
          tags: ghcr.io/forallcodesouls/cdp-browser-full:latest
          cache-from: type=gha,scope=browser-full
          cache-to: type=gha,mode=max,scope=browser-full

      # 两份镜像独立构建：改无头内核只跑这一步，不会重打完整镜像
      - name: Build & Push browser (headless)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.browser-headless
          push: true
          tags: ghcr.io/forallcodesouls/cdp-browser-headless:latest
          cache-from: type=gha,scope=browser-headless
          cache-to: type=gha,mode=max,scope=browser-headless

  manager-smoke:
    name: Manager image smoke test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull manager image
        run: docker pull ghcr.io/forallcodesouls/cdp-browser-manager:latest

      - name: Start manager
        run: |
          docker run -d --name cdp-manager-ci \
            -p 127.0.0.1:8000:8000 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e AUTO_PULL_IMAGES=0 \
            ghcr.io/forallcodesouls/cdp-browser-manager:latest

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --noproxy '*' http://127.0.0.1:8000/api/health >/dev/null; then
              echo "manager ready"
              exit 0
            fi
            sleep 1
          done
          docker logs cdp-manager-ci
          exit 1

      - name: Check core endpoints
        run: |
          curl -fsS --noproxy '*' http://127.0.0.1:8000/api/health
          echo
          curl -fsS --noproxy '*' http://127.0.0.1:8000/api/list
          echo
          curl -fsS --noproxy '*' http://127.0.0.1:8000/api/images/status
          echo

      - name: Cleanup manager
        if: always()
        run: docker rm -f cdp-manager-ci || true

  python-library-tests:
    name: Python library tests (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        mode: [full, headless]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull browser image
        run: docker pull ghcr.io/forallcodesouls/cdp-browser-${{ matrix.mode }}:latest

      - name: Start browser container
        run: |
          docker run -d --name cdp-ci-${{ matrix.mode }} \
            --shm-size=512m \
            -e BROWSER_MODE=${{ matrix.mode }} \
            -p 127.0.0.1:9222:9222 \
            ghcr.io/forallcodesouls/cdp-browser-${{ matrix.mode }}:latest

      - name: Wait for CDP
        run: |
          for i in $(seq 1 90); do
            if curl -fsS --noproxy '*' http://127.0.0.1:9222/json/version >/dev/null; then
              echo "cdp ready"
              exit 0
            fi
            sleep 1
          done
          docker logs cdp-ci-${{ matrix.mode }}
          exit 1

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests websocket-client playwright selenium pydoll-python

      - name: Run Python library tests
        run: |
          python .github/scripts/ci_browser_tests.py \
            --cdp http://127.0.0.1:9222 \
            --mode ${{ matrix.mode }}

      - name: Cleanup browser container
        if: always()
        run: docker rm -f cdp-ci-${{ matrix.mode }} || true
