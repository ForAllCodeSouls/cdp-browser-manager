name: Build & Push CDP Browser Manager

on:
  push:
    branches: [ main ]
  # 允许在 Actions 页面手动重建单个镜像/全部镜像：手动触发一律全量重建，
  # 用于缓存损坏或想强制重打时，不必为了重打而改代码。
  workflow_dispatch:

# 旧构建跑完再跑新的，避免两个 run 同时覆盖 :latest 造成版本错乱。
concurrency:
  group: cdp-browser-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 关键：按文件变更决定要不要重打镜像。
  # 过去每次 push（哪怕只改 README）都会重打 full/headless，manifest digest 随之变化，
  # 面板后台检测到「本地 != 远端」就亮红点——其实浏览器内容根本没变，属于假更新。
  # 现在浏览器镜像只依赖各自的 Dockerfile 和 start.sh，其它改动一律跳过，digest 保持稳定。
  changes:
    name: 检测镜像输入是否变更
    runs-on: ubuntu-latest
    outputs:
      manager: ${{ steps.filter.outputs.manager }}
      full: ${{ steps.filter.outputs.full }}
      headless: ${{ steps.filter.outputs.headless }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 计算各镜像是否需要重建
        id: filter
        run: |
          set -euo pipefail
          all() {
            echo "manager=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "headless=true" >> "$GITHUB_OUTPUT"
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发：全量重建"
            all
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "首次推送：全量重建"
            all
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)
          echo "本次变更文件："
          echo "$CHANGED"
          m=false; f=false; h=false
          echo "$CHANGED" | grep -qE '^(Dockerfile\.manager|requirements\.txt|app/)' && m=true || true
          echo "$CHANGED" | grep -qE '^(Dockerfile\.browser|start\.sh)$' && f=true || true
          echo "$CHANGED" | grep -qE '^(Dockerfile\.browser-headless|start\.sh)$' && h=true || true
          echo "manager=$m" >> "$GITHUB_OUTPUT"
          echo "full=$f" >> "$GITHUB_OUTPUT"
          echo "headless=$h" >> "$GITHUB_OUTPUT"
          echo "需要重建：manager=$m full=$f headless=$h"

  build:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push manager
        if: needs.changes.outputs.manager == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.manager
          push: true
          tags: ghcr.io/forallcodesouls/cdp-browser-manager:latest
          # scope 分开，三份镜像的缓存互不污染。
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager

      - name: Build & Push browser (full)
        if: needs.changes.outputs.full == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.browser
          push: true
          tags: ghcr.io/forallcodesouls/cdp-browser-full:latest
          cache-from: type=gha,scope=browser-full
          cache-to: type=gha,mode=max,scope=browser-full
          # 关掉 provenance 证明：它每次构建都带时间戳，即使层完全相同也会让
          # manifest digest 变化，导致面板误判「有更新」而亮红点。
          provenance: false

      # 两份镜像独立构建：改无头内核只跑这一步，不会重打完整镜像
      - name: Build & Push browser (headless)
        if: needs.changes.outputs.headless == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.browser-headless
          push: true
          tags: ghcr.io/forallcodesouls/cdp-browser-headless:latest
          cache-from: type=gha,scope=browser-headless
          cache-to: type=gha,mode=max,scope=browser-headless
          provenance: false

      - name: 记录未重建的镜像
        run: |
          echo "本次未触发重建的镜像保持 GHCR 上原 digest 不变（面板不会误报更新）"

  manager-smoke:
    name: Manager image smoke test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull manager image
        run: docker pull ghcr.io/forallcodesouls/cdp-browser-manager:latest

      - name: Start manager
        run: |
          docker run -d --name cdp-manager-ci \
            -p 127.0.0.1:8000:8000 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e AUTO_PULL_IMAGES=0 \
            ghcr.io/forallcodesouls/cdp-browser-manager:latest

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --noproxy '*' http://127.0.0.1:8000/api/health >/dev/null; then
              echo "manager ready"
              exit 0
            fi
            sleep 1
          done
          docker logs cdp-manager-ci
          exit 1

      - name: Check core endpoints
        run: |
          curl -fsS --noproxy '*' http://127.0.0.1:8000/api/health
          echo
          curl -fsS --noproxy '*' http://127.0.0.1:8000/api/list
          echo
          curl -fsS --noproxy '*' http://127.0.0.1:8000/api/images/status
          echo

      - name: Cleanup manager
        if: always()
        run: docker rm -f cdp-manager-ci || true

  python-library-tests:
    name: Python library tests (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # headless-new 复用 full 镜像，只是启动参数不同（--headless=new）。
        include:
          - mode: full
            image: ghcr.io/forallcodesouls/cdp-browser-full:latest
          - mode: headless
            image: ghcr.io/forallcodesouls/cdp-browser-headless:latest
          - mode: headless-new
            image: ghcr.io/forallcodesouls/cdp-browser-full:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull browser image
        run: docker pull ${{ matrix.image }}

      - name: Start browser container
        run: |
          docker run -d --name cdp-ci-${{ matrix.mode }} \
            --shm-size=512m \
            -e BROWSER_MODE=${{ matrix.mode }} \
            -p 127.0.0.1:9222:9222 \
            ${{ matrix.image }}

      - name: Wait for CDP
        run: |
          for i in $(seq 1 90); do
            if curl -fsS --noproxy '*' http://127.0.0.1:9222/json/version >/dev/null; then
              echo "cdp ready"
              exit 0
            fi
            sleep 1
          done
          docker logs cdp-ci-${{ matrix.mode }}
          exit 1

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests websocket-client playwright selenium pydoll-python

      - name: Run Python library tests
        run: |
          python .github/scripts/ci_browser_tests.py \
            --cdp http://127.0.0.1:9222 \
            --mode ${{ matrix.mode }}

      - name: Cleanup browser container
        if: always()
        run: docker rm -f cdp-ci-${{ matrix.mode }} || true
