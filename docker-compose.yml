services:
  cdp-manager:
    image: ghcr.io/forallcodesouls/cdp-browser-manager:latest
    container_name: cdp-manager
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BROWSER_IMAGE_FULL: ghcr.io/forallcodesouls/cdp-browser-full:latest
      BROWSER_IMAGE_HEADLESS: ghcr.io/forallcodesouls/cdp-browser-headless:latest
      # 定时自动更新：每 6 小时检查一次浏览器镜像，仅当无运行实例时自动拉取。
      # AUTO_PULL_IMAGES=0 关闭自动更新；AUTO_UPDATE_INTERVAL_HOURS 改检查间隔（小时，最小 1）。
      AUTO_PULL_IMAGES: "1"
      AUTO_UPDATE_INTERVAL_HOURS: "6"
      # 反向代理时填对外地址，如 https://cdp.example.com；留空则按访问请求的 Host 生成
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      # 可选：设置后本机所有管理 API / CDP / WS 都要带同一密钥，前端首次打开时输入一次。
      # 留空 = 完全不启用鉴权，现有单主机部署行为不变。
      # API_KEY: ${API_KEY:-}
      # 可选：多主机聚合。远端主机的地址与密钥只写在服务端，浏览器端看不到。
      # 面板只连本机，/remote/<id>/... 由本机 manager 代理到远端 manager。
      # REMOTE_HOSTS: '[{"id":"b","name":"主机B","base":"https://b.example.com","key":"远端API_KEY"}]'
      # 也支持简易格式：b|主机B|https://b.example.com|远端API_KEY;c|主机C|http://10.0.0.2:8000|
      # REMOTE_HOSTS: ${REMOTE_HOSTS:-}
      # 可选调优：抓屏帧上限 / 静止补帧间隔 / 每个实例共享内存
      # CAST_MAX_WIDTH: "1920"
      # CAST_MAX_HEIGHT: "1080"
      # CAST_KEEPALIVE_SEC: "1.5"  # 静态页无 screencast 帧时主动截图的间隔（秒）
      # BROWSER_SHM_SIZE: 512m
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # 占位服务：让 `docker compose --profile no-auto-start pull` 能更新两份 browser 镜像。
  # 带 profile 不会被 `docker compose up -d` 启动；manager 按需创建 browser 容器。
  # 注意：Dockge 等面板的「更新」通常跳过带 profile 的服务——此时靠 manager 的
  # 定时自动更新（每 6 小时、无实例时执行），或在设置里点「立即更新 / 强制拉取」。
  cdp-browser-full-image:
    image: ghcr.io/forallcodesouls/cdp-browser-full:latest
    profiles: ["no-auto-start"]

  cdp-browser-headless-image:
    image: ghcr.io/forallcodesouls/cdp-browser-headless:latest
    profiles: ["no-auto-start"]
