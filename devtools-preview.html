<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网络抓包 · 开发者工具</title>
<style>
:root{
  --bg:#202124; --bg2:#292a2d; --bg3:#35363a; --border:#3c4043;
  --text:#e8eaed; --muted:#9aa0a6; --accent:#8ab4f8; --accent-soft:rgba(138,180,248,.16);
  --tag:#81c995; --attr:#c58af9; --str:#fdd663; --num:#f28b82; --cmt:#5f6368;
  --err:#f28b82; --warn:#fdd663; --ok:#81c995;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#161719;color:var(--text);
  font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;
  overflow:hidden;
}
svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit}

/* 顶部连接栏 */
.conn{
  min-height:56px;padding:8px 14px;background:#1d1e20;border-bottom:1px solid #303134;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#e8eaed}
.brand svg{width:18px;height:18px;stroke:var(--accent)}
.brand small{font-weight:400;color:var(--muted);font-size:11px}
.form{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.form label{font-size:11px;color:var(--muted)}
.form input{
  background:#2b2c2f;border:1px solid #444;color:var(--text);border-radius:5px;
  height:26px;padding:0 8px;font:11px ui-monospace,monospace;outline:none;
}
.form input:focus{border-color:var(--accent)}
.form input.base{width:196px}.form input.sid{width:112px}.form input.tid{width:150px}.form input.key{width:92px}
.btn{
  height:26px;padding:0 12px;border-radius:5px;border:1px solid #3c4043;cursor:pointer;
  background:var(--accent);color:#202124;font-weight:600;font-size:11px;
}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text)}
.btn.ghost:hover{background:var(--bg3)}
.btn.danger{background:var(--err);color:#202124}
.conn .state{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#5f6368;display:inline-block}
.dot.on{background:var(--ok)}.dot.err{background:var(--err)}

/* 主外壳 */
.shell{
  height:calc(100vh - 56px);min-height:480px;margin:10px;display:flex;flex-direction:column;
  background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.45);
}
.tabbar{height:34px;flex:0 0 34px;background:var(--bg2);display:flex;align-items:stretch;border-bottom:1px solid var(--border)}
.tab{padding:0 14px;display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative;font-size:12px}
.tab:hover{color:var(--text);background:#2e2f32}
.tab.on{color:var(--text);background:var(--bg)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.tabbar .spacer{flex:1}
.tabbar .hint{padding:0 12px;display:flex;align-items:center;color:var(--muted);font-size:11px}

.toolbar{
  height:34px;flex:0 0 34px;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--muted);
}
.toolbar .tbtn{
  height:24px;padding:0 9px;display:flex;align-items:center;gap:5px;border:1px solid transparent;
  border-radius:4px;cursor:pointer;background:transparent;color:var(--muted);font-size:11px;
}
.toolbar .tbtn:hover{background:var(--bg3);color:var(--text);border-color:#4a4d51}
.toolbar .tbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.toolbar .spacer{flex:1}
.toolbar input.search{
  width:210px;height:23px;background:#1f2022;border:1px solid #444;border-radius:10px;
  color:var(--muted);font-size:11px;padding:0 10px;outline:none;
}
.toolbar input.search:focus{border-color:var(--accent);color:var(--text)}
.count{font-size:11px;color:var(--muted)}

.panel{display:none;flex:1;min-width:0;min-height:0;flex-direction:column}
.panel.on{display:flex}

/* Network 表格 */
.net-wrap{flex:1;min-height:0;overflow:auto}
.net-table{width:100%;border-collapse:collapse;font:11px ui-monospace,monospace}
.net-table th{
  position:sticky;top:0;background:var(--bg2);color:var(--muted);text-align:left;
  padding:6px 10px;border-bottom:1px solid var(--border);font-weight:500;z-index:1;
}
.net-table td{padding:5px 10px;border-bottom:1px solid #2e2f32;color:#c9cdd2;cursor:default;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.net-table tr:hover td{background:#2a2b2e}
.net-table tr.sel td{background:var(--accent-soft)}
.st-2{color:var(--ok)}.st-3{color:#9aa0a6}.st-4{color:var(--warn)}.st-5{color:var(--err)}
.muted-txt{color:var(--muted)}

.detail{height:190px;flex:0 0 190px;border-top:1px solid var(--border);background:#232427;display:flex;flex-direction:column}
.detail-tabs{height:28px;flex:0 0 28px;display:flex;background:var(--bg2);border-bottom:1px solid var(--border)}
.detail-tab{padding:0 12px;display:flex;align-items:center;color:var(--muted);cursor:pointer;font-size:11px;border-right:1px solid var(--border)}
.detail-tab.on{color:var(--text);background:#232427;box-shadow:inset 0 -2px 0 var(--accent)}
.detail-body{flex:1;overflow:auto;padding:8px 12px;font:11px/1.7 ui-monospace,monospace;color:#c9cdd2;white-space:pre-wrap;word-break:break-all}
.detail-body .k{color:var(--attr)}

/* Console */
.console-log{flex:1;overflow:auto;padding:8px 12px;font:11.5px/1.7 ui-monospace,monospace}
.logrow{display:flex;gap:8px;padding:2px 0;border-bottom:1px solid #2a2b2d}
.logrow .ic{width:14px;flex:0 0 14px;text-align:center}
.logrow.err .ic,.logrow.err .msg{color:var(--err)}
.logrow.warn .ic,.logrow.warn .msg{color:var(--warn)}
.logrow.ok .ic{color:var(--ok)}
.logrow .msg{color:#d7d9dc;white-space:pre-wrap;word-break:break-all}

/* 右键菜单 */
.ctx-menu{
  position:absolute;z-index:50;min-width:210px;background:#2b2c2f;border:1px solid #4a4d51;
  border-radius:7px;padding:4px;box-shadow:0 8px 26px rgba(0,0,0,.55);display:none;
}
.ctx-menu.open{display:block}
.ctx-item{padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--text);display:flex;gap:8px;align-items:center}
.ctx-item:hover{background:var(--accent);color:#202124}
.ctx-sep{height:1px;background:var(--border);margin:4px 2px}
.ctx-title{padding:5px 10px;color:var(--muted);font-size:10px}

/* 状态栏 */
.statusbar{height:24px;flex:0 0 24px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:14px;color:var(--muted);font-size:10.5px}
.statusbar .spacer{flex:1}

/* Toast */
.toast{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
  background:#323335;border:1px solid #4a4d51;color:var(--text);padding:8px 14px;
  border-radius:6px;font-size:12px;z-index:80;display:none;box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.toast.show{display:block}
.shell{position:relative}
</style>
</head>
<body>

<div class="conn">
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 5-8 4 3"/></svg>
    网络抓包 <small>· 中文开发者工具</small>
  </div>
  <div class="form">
    <label>管理器</label><input class="base" id="fBase" value="http://156.233.226.94:8001">
    <label>实例 sid</label><input class="sid" id="fSid" placeholder="实例 SID">
    <label>标签 tid</label><input class="tid" id="fTid" placeholder="留空则自动取当前标签">
    <label>密钥</label><input class="key" id="fKey" placeholder="可留空">
    <button class="btn" id="btnConn" onclick="toggleConnect()">开始抓包</button>
    <button class="btn ghost" onclick="clearRows()">清空</button>
  </div>
  <div class="state"><span class="dot" id="stateDot"></span><span id="stateText">未连接</span></div>
</div>

<div class="shell" id="shell">
  <div class="tabbar">
    <div class="tab on" data-p="network">网络</div>
    <div class="tab" data-p="console">控制台</div>
    <div class="spacer"></div>
    <div class="hint" id="hostHint">右键请求可复制 cURL / 转 Python</div>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="tbtn on" id="btnRecord" onclick="toggleRecord()"><span class="dot on"></span>录制中</button>
    <button class="tbtn" onclick="clearRows()">清空</button>
    <span class="spacer"></span>
    <span class="count" id="cnt">0 个请求</span>
    <input class="search" id="filter" placeholder="过滤 URL（支持中文输入）" oninput="applyFilter()">
  </div>

  <!-- 网络面板 -->
  <div class="panel on" id="p-network">
    <div class="net-wrap">
      <table class="net-table">
        <thead><tr>
          <th style="width:34%">名称</th><th style="width:8%">状态</th><th style="width:12%">类型</th>
          <th style="width:10%">方法</th><th style="width:26%">地址</th><th style="width:10%">耗时</th>
        </tr></thead>
        <tbody id="netBody"></tbody>
      </table>
    </div>
    <div class="detail">
      <div class="detail-tabs">
        <div class="detail-tab on" data-d="headers">请求头</div>
        <div class="detail-tab" data-d="payload">请求体</div>
        <div class="detail-tab" data-d="python">Python 代码</div>
        <div class="detail-tab" data-d="curl">cURL</div>
      </div>
      <div class="detail-body" id="detailBody">点击上方请求查看详情；右键请求可直接复制。</div>
    </div>
  </div>

  <!-- 控制台面板 -->
  <div class="panel" id="p-console">
    <div class="console-log" id="consoleLog">
      <div class="logrow"><span class="ic">›</span><span class="msg">连接后这里会实时显示页面 console 与异常。</span></div>
    </div>
  </div>

  <div class="statusbar">
    <span id="statusConn">未连接</span>
    <span id="statusCount">0 个请求</span>
    <div class="spacer"></div>
    <span>中文开发者工具 · 基于 CDP 实时抓包</span>
  </div>

  <!-- 右键菜单 -->
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-title" id="ctxTitle">请求操作</div>
    <div class="ctx-item" data-act="curl-unix" onclick="ctxAction('curl-unix')">复制为 cURL (bash)</div>
    <div class="ctx-item" data-act="curl-cmd" onclick="ctxAction('curl-cmd')">复制为 cURL (cmd)</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-act="py-requests" onclick="ctxAction('py-requests')">复制为 Python (requests)</div>
    <div class="ctx-item" data-act="py-httpx" onclick="ctxAction('py-httpx')">复制为 Python (httpx)</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-act="copy-url" onclick="ctxAction('copy-url')">复制请求地址</div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ---------- 状态 ----------
var ws = null, connected = false, recording = true;
var requests = [], filtered = [], selected = null, callId = 100, pending = {};
var detailTab = "headers";

function $(id){ return document.getElementById(id); }
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}
function setState(text, kind){
  $("stateText").textContent = text;
  $("statusConn").textContent = text;
  var d = $("stateDot"); d.className = "dot" + (kind ? " " + kind : "");
}

// ---------- 连接 ----------
function baseUrl(){
  return $("fBase").value.trim().replace(/\/+$/, "");
}
function wsUrl(scheme, path){
  var b = baseUrl();
  var u = new URL(b);
  return scheme + "://" + u.host + path;
}
function keyParam(){ return $("fKey").value.trim(); }

async function resolveTid(){
  var tid = $("fTid").value.trim();
  if (tid) return tid;
  // 未填 tid 时，从 /api/instance/<sid>/targets 取第一个页面标签
  var sid = $("fSid").value.trim();
  if (!sid) return "";
  var key = keyParam();
  var url = baseUrl() + "/api/instance/" + encodeURIComponent(sid) + "/targets" + (key ? "?key=" + encodeURIComponent(key) : "");
  var r = await fetch(url);
  var d = await r.json();
  var list = Array.isArray(d) ? d : (d.targets || d.items || []);
  for (var i=0;i<list.length;i++){
    var t = list[i];
    var id = t.id || t.targetId || t.tid;
    var type = t.type || "";
    var u = t.url || "";
    if (id && (type === "page" || /^https?:/.test(u))) { $("fTid").value = id; return id; }
  }
  return "";
}

async function toggleConnect(){
  if (connected) { disconnect(); return; }
  var sid = $("fSid").value.trim();
  if (!sid) { toast("请填写实例 sid"); return; }
  setState("正在解析标签…", "");
  var tid;
  try { tid = await resolveTid(); } catch (e) { setState("标签解析失败", "err"); toast("标签解析失败：" + e); return; }
  if (!tid) { setState("未找到标签", "err"); toast("未找到可抓包的页面标签"); return; }

  var key = keyParam();
  var path = "/ws/inspect/" + encodeURIComponent(sid) + "/" + encodeURIComponent(tid) +
    "?domain=network" + (key ? "&key=" + encodeURIComponent(key) : "");
  var url = wsUrl(location.protocol === "https:" ? "wss" : "ws", path);
  setState("连接中…", "");
  try {
    ws = new WebSocket(url);
  } catch (e) { setState("连接失败", "err"); toast("连接失败：" + e); return; }

  ws.onopen = function(){
    connected = true;
    $("btnConn").textContent = "停止抓包";
    $("btnConn").className = "btn danger";
    setState("抓包中 · " + tid.slice(0,8), "on");
    log("已连接，开始监听 Network 事件", "ok");
  };
  ws.onmessage = function(ev){
    var m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === "event") handleEvent(m.method, m.params || {});
    else if (m.type === "result" && m.msg && m.msg.id != null && pending[m.msg.id]) {
      pending[m.msg.id](m.msg.result || {}); delete pending[m.msg.id];
    } else if (m.type === "error") { log("错误：" + m.message, "err"); }
  };
  ws.onclose = function(){ disconnect(true); };
  ws.onerror = function(){ setState("连接错误", "err"); };
}

function disconnect(silent){
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  connected = false;
  $("btnConn").textContent = "开始抓包";
  $("btnConn").className = "btn";
  setState("未连接", "");
  if (!silent) log("已停止抓包", "warn");
}

function sendCmd(method, params, cb){
  if (!ws || !connected) { if (cb) cb({}); return; }
  var id = ++callId;
  if (cb) pending[id] = cb;
  ws.send(JSON.stringify({ type: "cmd", method: method, params: params || {} }));
}

// ---------- CDP 事件 → 请求行 ----------
function handleEvent(method, p){
  if (method === "Network.requestWillBeSent") {
    var req = {
      id: p.requestId, url: p.request && p.request.url || "",
      method: p.request && p.request.method || "GET",
      headers: p.request && p.request.headers || {},
      postData: p.request && p.request.postData || "",
      type: p.type || "other", status: 0, start: p.timestamp,
      mime: "", encoded: false, fromCache: false
    };
    req.name = shortName(req.url);
    requests.unshift(req);
    render();
  } else if (method === "Network.responseReceived") {
    var r = findReq(p.requestId);
    if (r) {
      r.status = p.response && p.response.status || 0;
      r.mime = p.response && p.response.mimeType || "";
      r.encoded = !!(p.response && p.response.encodedDataLength);
      r.headers = p.response && p.response.headers || r.headers;
      r.remoteIP = p.response && p.response.remoteIPAddress || "";
      render();
    }
  } else if (method === "Network.loadingFinished") {
    var f = findReq(p.requestId);
    if (f) { f.duration = (p.timestamp - f.start) * 1000; render(); }
  } else if (method === "Network.loadingFailed") {
    var x = findReq(p.requestId);
    if (x) { x.status = -1; x.error = p.errorText || "失败"; render(); }
  } else if (method === "Network.requestWillBeSentExtraInfo" || method === "Network.responseReceivedExtraInfo") {
    // 额外请求头（含 cookie），补全到已有请求
    var e = findReq(p.requestId);
    if (e && p.headers) { e.headers = Object.assign({}, e.headers, p.headers); }
  }
}
function findReq(id){ for (var i=0;i<requests.length;i++) if (requests[i].id === id) return requests[i]; return null; }
function shortName(url){
  try { var u = new URL(url); var p = u.pathname.split("/").filter(Boolean); return p.length ? p[p.length-1] : (u.hostname || url); }
  catch (e) { return url; }
}
function statusClass(s){ return s >= 500 ? "st-5" : s >= 400 ? "st-4" : s >= 300 ? "st-3" : s >= 200 ? "st-2" : "muted-txt"; }

function render(){
  var q = ($("filter").value || "").trim().toLowerCase();
  filtered = q ? requests.filter(function(r){ return (r.url + r.name).toLowerCase().indexOf(q) >= 0; }) : requests.slice();
  $("cnt").textContent = filtered.length + " 个请求";
  $("statusCount").textContent = filtered.length + " 个请求";
  var html = "";
  for (var i=0;i<filtered.length;i++){
    var r = filtered[i];
    var st = r.status < 0 ? "ERR" : (r.status || "…");
    html += "<tr data-id='" + escapeAttr(r.id) + "' class='" + (selected === r.id ? "sel" : "") + "'>" +
      "<td title='" + escapeAttr(r.url) + "'>" + escapeHtml(r.name) + "</td>" +
      "<td class='" + statusClass(r.status) + "'>" + st + "</td>" +
      "<td>" + escapeHtml(r.mime || r.type) + "</td>" +
      "<td>" + escapeHtml(r.method) + "</td>" +
      "<td class='muted-txt' title='" + escapeAttr(r.url) + "'>" + escapeHtml(r.url) + "</td>" +
      "<td>" + (r.duration ? r.duration.toFixed(0) + " ms" : (r.error || "—")) + "</td></tr>";
  }
  $("netBody").innerHTML = html;
  // 绑定点击与右键
  Array.prototype.forEach.call($("netBody").querySelectorAll("tr"), function(tr){
    tr.onclick = function(){ selectReq(tr.getAttribute("data-id")); };
    tr.oncontextmenu = function(e){ e.preventDefault(); selectReq(tr.getAttribute("data-id")); showCtx(e.clientX, e.clientY); };
  });
}
function escapeHtml(s){ return String(s == null ? "" : s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g, "&#39;"); }
function applyFilter(){ render(); }
function clearRows(){ requests = []; selected = null; render(); $("detailBody").textContent = "已清空"; }

// ---------- 详情与导出 ----------
function selectReq(id){
  selected = id; render(); renderDetail();
}
Array.prototype.forEach.call(document.querySelectorAll(".detail-tab"), function(tab){
  tab.onclick = function(){
    detailTab = tab.getAttribute("data-d");
    Array.prototype.forEach.call(document.querySelectorAll(".detail-tab"), function(x){ x.classList.toggle("on", x === tab); });
    renderDetail();
  };
});
function currentReq(){ return findReq(selected); }

function headerLines(req){
  var h = req.headers || {};
  return Object.keys(h).map(function(k){ return "  " + k + ": " + h[k]; }).join("\n");
}
function renderDetail(){
  var r = currentReq();
  if (!r) { $("detailBody").textContent = "点击上方请求查看详情"; return; }
  var box = $("detailBody");
  if (detailTab === "headers") {
    box.innerHTML = "<span class='k'>请求</span> " + escapeHtml(r.method) + " " + escapeHtml(r.url) +
      "\n<span class='k'>类型</span> " + escapeHtml(r.mime || r.type) +
      "\n<span class='k'>状态</span> " + (r.status || "—") +
      "\n<span class='k'>请求头</span>\n" + escapeHtml(headerLines(r) || "  （无）");
  } else if (detailTab === "payload") {
    box.textContent = r.postData || "（无请求体）";
    // 尝试取响应体
    if (r.status && r.id) {
      sendCmd("Network.getResponseBody", { requestId: r.id }, function(res){
        if (res && res.body) box.textContent = "【请求体】\n" + (r.postData || "（无）") + "\n\n【响应体】\n" + res.body;
      });
    }
  } else if (detailTab === "python") {
    box.textContent = genPython("requests", r);
  } else if (detailTab === "curl") {
    box.textContent = genCurl("unix", r) + "\n\n" + genCurl("win", r);
  }
}
function pyQ(s){ return JSON.stringify(String(s == null ? "" : s)); }
function genPython(style, r){
  var h = r.headers || {}, hj = JSON.stringify(h, null, 2), body = r.postData || "";
  var L = ["# 由网络抓包生成", style === "requests" ? "import requests" : "import httpx", "",
    "url = " + pyQ(r.url), "headers = " + hj];
  if (body) L.push("data = " + pyQ(body));
  L.push("");
  if (style === "requests") {
    L.push("resp = requests.request(");
    L.push("  " + pyQ(r.method) + ", url, headers=headers" + (body ? ", data=data" : ""));
    L.push(")");
  } else {
    L.push("with httpx.Client() as cl:");
    L.push("  resp = cl.request(");
    L.push("    " + pyQ(r.method) + ", url, headers=headers" + (body ? ", data=data" : ""));
    L.push("  )");
  }
  L.push("print(resp.status_code)", "print(resp.text)");
  return L.join("\n");
}
function curlQ(s){
  return "'" + String(s == null ? "" : s).replace(/'/g, "'\\''") + "'";
}
function genCurl(shell, r){
  var parts = ["curl", "--url " + curlQ(r.url)];
  if (r.method && r.method !== "GET") parts.push("-X " + curlQ(r.method));
  var skip = { "host":1, "content-length":1, "accept-encoding":1, "connection":1 };
  var h = r.headers || {};
  Object.keys(h).forEach(function(k){
    if (skip[k.toLowerCase()]) return;
    parts.push("-H " + curlQ(k + ": " + h[k]));
  });
  if (r.postData) parts.push("--data-raw " + curlQ(r.postData));
  var sep = shell === "win" ? " ^\n  " : " \\\n  ";
  return parts.join(sep);
}

// ---------- 右键菜单 ----------
var ctxReqId = null;
function showCtx(x, y){
  var menu = $("ctxMenu"), shell = $("shell").getBoundingClientRect();
  menu.classList.add("open");
  var mw = 220, mh = 240;
  menu.style.left = Math.min(x - shell.left, shell.width - mw - 6) + "px";
  menu.style.top = Math.min(y - shell.top, shell.height - mh - 6) + "px";
  ctxReqId = selected;
  $("ctxTitle").textContent = currentReq() ? shortName(currentReq().url) : "请求操作";
}
document.addEventListener("click", function(){ $("ctxMenu").classList.remove("open"); });
function ctxAction(act){
  var r = findReq(ctxReqId); $("ctxMenu").classList.remove("open");
  if (!r) { toast("请先选中请求"); return; }
  var text = "";
  if (act === "curl-unix") text = genCurl("unix", r);
  else if (act === "curl-cmd") text = genCurl("win", r);
  else if (act === "py-requests") text = genPython("requests", r);
  else if (act === "py-httpx") text = genPython("httpx", r);
  else if (act === "copy-url") text = r.url;
  copyText(text);
  toast("已复制：" + act.replace("py-", "Python ").replace("curl-", "cURL "));
}
function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta = document.createElement("textarea"); ta.value = text;
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}

// ---------- 录制开关 ----------
function toggleRecord(){
  recording = !recording;
  var b = $("btnRecord");
  b.className = "tbtn" + (recording ? " on" : "");
  b.innerHTML = "<span class='dot" + (recording ? " on" : "") + "'></span>" + (recording ? "录制中" : "已暂停");
}

// ---------- 控制台 ----------
function log(msg, kind){
  var box = $("consoleLog");
  var row = document.createElement("div");
  row.className = "logrow" + (kind ? " " + kind : "");
  var ic = kind === "err" ? "✕" : kind === "warn" ? "!" : kind === "ok" ? "✓" : "›";
  row.innerHTML = "<span class='ic'>" + ic + "</span><span class='msg'></span>";
  row.querySelector(".msg").textContent = msg;
  box.appendChild(row); box.scrollTop = box.scrollHeight;
}

// ---------- 标签切换 ----------
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(tab){
  tab.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(x){ x.classList.toggle("on", x === tab); });
    Array.prototype.forEach.call(document.querySelectorAll(".panel"), function(p){ p.classList.remove("on"); });
    $("p-" + tab.getAttribute("data-p")).classList.add("on");
  };
});

render();
